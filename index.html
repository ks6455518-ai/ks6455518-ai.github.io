<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Arcade Game Center</title>
    <style>
        body {
            margin: 0;
            background-color: #111;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        h1 { color: #ffeb3b; margin-bottom: 20px; font-size: 1.8rem; text-shadow: 0 0 10px rgba(255,235,59,0.5); }
        .menu-btn {
            background-color: #333;
            color: white;
            border: 2px solid #555;
            padding: 15px 30px;
            font-size: 1.2rem;
            margin: 10px;
            border-radius: 10px;
            cursor: pointer;
            width: 200px;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            transition: 0.2s;
        }
        .menu-btn:active { transform: scale(0.95); }
        #snake-btn { border-color: #4CAF50; color: #4CAF50; }
        #pong-btn { border-color: #2196F3; color: #2196F3; }
        
        /* Game Screen Layouts */
        .game-screen { display: none; flex-direction: column; align-items: center; justify-content: center; }
        .back-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            background: #222;
            color: #fff;
            border: 1px solid #777;
            padding: 8px 15px;
            border-radius: 5px;
            font-size: 0.9rem;
        }
        canvas { background-color: #000; box-shadow: 0 10px 25px rgba(0,0,0,0.6); max-width: 90vw; }
        
        /* Snake Controls */
        #snake-canvas { border: 3px solid #4CAF50; max-height: 45vh; }
        .controls { margin-top: 10px; display: grid; grid-template-columns: repeat(3, 65px); grid-template-rows: repeat(2, 55px); gap: 6px; }
        .btn { background-color: #333; color: white; border: 2px solid #555; border-radius: 8px; font-size: 1.3rem; display: flex; align-items: center; justify-content: center; user-select: none; touch-action: manipulation; }
        .btn:active { background-color: #4CAF50; }
        .up { grid-column: 2; } .left { grid-column: 1; grid-row: 2; } .down { grid-column: 2; grid-row: 2; } .right { grid-column: 3; grid-row: 2; }

        /* Pong Controls */
        #pong-canvas { border: 3px solid #2196F3; max-height: 55vh; }
        #pong-screen p { color: #aaa; font-size: 0.85rem; text-align: center; margin: 5px 0 10px 0; }
    </style>
</head>
<body>

    <!-- MAIN MENU -->
    <div id="main-menu" style="display: flex; flex-direction: column; align-items: center;">
        <h1>🕹️ ARCADE CENTER 🕹️</h1>
        <button class="menu-btn" id="snake-btn" onclick="startSnake()">🐍 SNAKE</button>
        <button class="menu-btn" id="pong-btn" onclick="startPong()">🏓 PING PONG</button>
    </div>

    <!-- SNAKE SCREEN -->
    <div id="snake-screen" class="game-screen">
        <button class="back-btn" onclick="goHome()">◀ Menu</button>
        <h2 style="color: #4CAF50; margin: 5px;">Score: <span id="snake-score">0</span></h2>
        <canvas id="snake-canvas" width="400" height="400"></canvas>
        <div class="controls">
            <div class="btn up" onclick="changeSnakeDir('UP')">▲</div>
            <div class="btn left" onclick="changeSnakeDir('LEFT')">◀</div>
            <div class="btn down" onclick="changeSnakeDir('DOWN')">▼</div>
            <div class="btn right" onclick="changeSnakeDir('RIGHT')">▶</div>
        </div>
    </div>

    <!-- PONG SCREEN -->
    <div id="pong-screen" class="game-screen">
        <button class="back-btn" onclick="goHome()">◀ Menu</button>
        <h2 style="color: #2196F3; margin: 5px;">Player: <span id="p1-score">0</span> | AI: <span id="p2-score">0</span></h2>
        <p>Drag your finger or mouse on the screen to move your paddle</p>
        <canvas id="pong-canvas" width="600" height="400"></canvas>
    </div>

    <script>
        let activeGame = null;
        let snakeLoop, pongLoop;

        function goHome() {
            clearInterval(snakeLoop);
            cancelAnimationFrame(pongLoop);
            activeGame = null;
            document.getElementById("snake-screen").style.display = "none";
            document.getElementById("pong-screen").style.display = "none";
            document.getElementById("main-menu").style.display = "flex";
        }

        // ==================== SNAKE GAME LOGIC ====================
        const sCanvas = document.getElementById("snake-canvas");
        const sCtx = sCanvas.getContext("2d");
        let snake, food, sDx, sDy, sScore, sDir;

        function startSnake() {
            document.getElementById("main-menu").style.display = "none";
            document.getElementById("snake-screen").style.display = "flex";
            activeGame = "snake";
            snake = [{x: 10, y: 10}];
            food = {x: 5, y: 5};
            sDx = 1; sDy = 0; sScore = 0; sDir = 'RIGHT';
            document.getElementById("snake-score").innerText = sScore;
            clearInterval(snakeLoop);
            snakeLoop = setInterval(runSnake, 100);
        }

        function runSnake() {
            const head = {x: snake[0].x + sDx, y: snake[0].y + sDy};
            if (head.x<0 || head.x>=20 || head.y<0 || head.y>=20 || snake.some(p => p.x===head.x && p.y===head.y)) {
                alert("Game Over! Score: " + sScore);
                startSnake();
                return;
            }
            snake.unshift(head);
            if (head.x === food.x && head.y === food.y) {
                sScore += 10; document.getElementById("snake-score").innerText = sScore;
                food = {x: Math.floor(Math.random()*20), y: Math.floor(Math.random()*20)};
            } else { snake.pop(); }

            sCtx.fillStyle = "#000"; sCtx.fillRect(0,0,400,400);
            sCtx.fillStyle = "#4CAF50"; snake.forEach((p,i) => { sCtx.fillStyle = i===0?"#8BC34A":"#4CAF50"; sCtx.fillRect(p.x*20, p.y*20, 18, 18); });
            sCtx.fillStyle = "#FF5722"; sCtx.fillRect(food.x*20, food.y*20, 18, 18);
        }

        function changeSnakeDir(dir) {
            if (dir==='LEFT' && sDir!=='RIGHT') { sDx = -1; sDy = 0; sDir = 'LEFT'; }
            if (dir==='UP' && sDir!=='DOWN') { sDx = 0; sDy = -1; sDir = 'UP'; }
            if (dir==='RIGHT' && sDir!=='LEFT') { sDx = 1; sDy = 0; sDir = 'RIGHT'; }
            if (dir==='DOWN' && sDir!=='UP') { sDx = 0; sDy = 1; sDir = 'DOWN'; }
        }

        // ==================== PONG GAME LOGIC ====================
        const pCanvas = document.getElementById("pong-canvas");
        const pCtx = pCanvas.getContext("2d");
        let ball = {x: 300, y: 200, r: 8, sx: 4, sy: 4};
        let p1 = {y: 150, score: 0}, ai = {y: 150, score: 0};

        function startPong() {
            document.getElementById("main-menu").style.display = "none";
            document.getElementById("pong-screen").style.display = "flex";
            activeGame = "pong";
            p1.score = 0; ai.score = 0;
            document.getElementById("p1-score").innerText = 0; document.getElementById("p2-score").innerText = 0;
            resetPongBall();
            runPong();
        }

        function resetPongBall() {
            ball.x = 300; ball.y = 200; ball.sx = -ball.sx; ball.sy = (Math.random() > 0.5 ? 1 : -1) * 4;
        }

        function runPong() {
            if (activeGame !== "pong") return;
            ball.x += ball.sx; ball.y += ball.sy;
            if (ai.y + 40 < ball.y) ai.y += 3.2; else if (ai.y + 40 > ball.y) ai.y -= 3.2;
            if (ball.y - ball.r < 0 || ball.y + ball.r > 400) ball.sy = -ball.sy;
            
            let paddle = (ball.x < 300) ? {x: 10, y: p1.y} : {x: 578, y: ai.y};
            if (ball.x + ball.r > paddle.x && ball.x - ball.r < paddle.x + 12) {
                if (ball.y > paddle.y && ball.y < paddle.y + 80) { ball.sx = -ball.sx * 1.05; }
            }
            if (ball.x < 0) { ai.score++; document.getElementById("p2-score").innerText = ai.score; resetPongBall(); }
            if (ball.x > 600) { p1.score++; document.getElementById("p1-score").innerText = p1.score; resetPongBall(); }

            pCtx.fillStyle = "#000"; pCtx.fillRect(0,0,600,400);
            pCtx.fillStyle = "#fff"; for(let i=0; i<400; i+=20) pCtx.fillRect(299, i, 2, 10);
            pCtx.fillRect(10, p1.y, 12, 80); pCtx.fillRect(578, ai.y, 12, 80);
            pCtx.beginPath(); pCtx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2); pCtx.fill();
            pongLoop = requestAnimationFrame(runPong);
        }

        function handlePongMove(e) {
            if (activeGame !== "pong") return;
            let rect = pCanvas.getBoundingClientRect();
            let clientY = e.touches ? e.touches[0].clientY : e.clientY;
            p1.y = ((clientY - rect.top) * (400 / rect.height)) - 40;
        }
        window.addEventListener("mousemove", handlePongMove);
        window.addEventListener("touchmove", handlePongMove, { passive: false });

        // Global Key Listener
        window.addEventListener("keydown", e => {
            if (activeGame === "snake") {
                if (e.key === "ArrowLeft") changeSnakeDir('LEFT');
                if (e.key === "ArrowUp") changeSnakeDir('UP');
                if (e.key === "ArrowRight") changeSnakeDir('RIGHT');
                if (e.key === "ArrowDown") changeSnakeDir('DOWN');
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Retro Snake Game</title>
    <style>
        body {
            margin: 0;
            background-color: #111;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        h2 { margin: 5px 0; font-size: 1.5rem; color: #4CAF50; }
        #score-board { font-size: 1.1rem; margin-bottom: 10px; }
        canvas {
            background-color: #000;
            border: 3px solid #4CAF50;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            max-width: 90vw;
            max-height: 50vh;
        }
        .controls {
            margin-top: 15px;
            display: grid;
            grid-template-columns: repeat(3, 70px);
            grid-template-rows: repeat(2, 60px);
            gap: 8px;
            justify-content: center;
        }
        .btn {
            background-color: #333;
            color: white;
            border: 2px solid #555;
            border-radius: 8px;
            font-size: 1.5rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            touch-action: manipulation;
        }
        .btn:active { background-color: #4CAF50; border-color: #fff; }
        .up { grid-column: 2; }
        .left { grid-column: 1; grid-row: 2; }
        .down { grid-column: 2; grid-row: 2; }
        .right { grid-column: 3; grid-row: 2; }
    </style>
</head>
<body>

    <h2>🐍 RETRO SNAKE 🐍</h2>
    <div id="score-board">Score: <span id="score">0</span></div>
    
    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <!-- Mobile On-Screen Controls -->
    <div class="controls">
        <div class="btn up" onclick="changeDirection('UP')">▲</div>
        <div class="btn left" onclick="changeDirection('LEFT')">◀</div>
        <div class="btn down" onclick="changeDirection('DOWN')">▼</div>
        <div class="btn right" onclick="changeDirection('RIGHT')">▶</div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [{ x: 10, y: 10 }];
        let food = { x: 5, y: 5 };
        let dx = 1;
        let dy = 0;
        let score = 0;
        let gameInterval;
        let currentDirection = 'RIGHT';

        function gameLoop() {
            update();
            if (checkGameOver()) {
                alert("Game Over! Your Score: " + score);
                resetGame();
                return;
            }
            render();
        }

        function update() {
            // Move head forward
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);

            // Check if eating food
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                document.getElementById("score").innerText = score;
                generateFood();
            } else {
                snake.pop(); // Remove tail if not eating
            }
        }

        function render() {
            // Clear Canvas
            ctx.fillStyle = "#000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Snake
            ctx.fillStyle = "#4CAF50";
            snake.forEach((part, index) => {
                // Make head a slightly different color
                ctx.fillStyle = index === 0 ? "#8BC34A" : "#4CAF50";
                ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
            });

            // Draw Food
            ctx.fillStyle = "#FF5722";
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);
        }

        function changeDirection(dir) {
            if (dir === 'LEFT' && currentDirection !== 'RIGHT') { dx = -1; dy = 0; currentDirection = 'LEFT'; }
            if (dir === 'UP' && currentDirection !== 'DOWN') { dx = 0; dy = -1; currentDirection = 'UP'; }
            if (dir === 'RIGHT' && currentDirection !== 'LEFT') { dx = 1; dy = 0; currentDirection = 'RIGHT'; }
            if (dir === 'DOWN' && currentDirection !== 'UP') { dx = 0; dy = 1; currentDirection = 'DOWN'; }
        }

        // Listen for Keyboard Arrow Keys (Desktop)
        window.addEventListener("keydown", e => {
            if (e.key === "ArrowLeft") changeDirection('LEFT');
            if (e.key === "ArrowUp") changeDirection('UP');
            if (e.key === "ArrowRight") changeDirection('RIGHT');
            if (e.key === "ArrowDown") changeDirection('DOWN');
        });

        function generateFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);
            // Ensure food doesn't spawn on top of snake body
            snake.forEach(part => {
                if (part.x === food.x && part.y === food.y) generateFood();
            });
        }

        function checkGameOver() {
            const head = snake[0];
            // Wall collisions
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) return true;
            // Body collisions
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) return true;
            }
            return false;
        }

        function resetGame() {
            snake = [{ x: 10, y: 10 }];
            dx = 1;
            dy = 0;
            currentDirection = 'RIGHT';
            score = 0;
            document.getElementById("score").innerText = score;
            generateFood();
        }

        // Start Game with 100ms ticks (10 frames per second)
        generateFood();
        gameInterval = setInterval(gameLoop, 100);
    </script>
</body>
</html>
